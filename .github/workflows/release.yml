name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release -p bird-cli --bin bird-rs --target ${{ matrix.target }}

      - name: Package release asset
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          archive="bird-rs-${TAG}-${TARGET}.tar.gz"
          tar -czf "dist/${archive}" -C "target/${TARGET}/release" bird-rs
          shasum -a 256 "dist/${archive}" > "dist/${archive}.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: bird-rs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "${TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${TAG}" --repo "${REPOSITORY}" --generate-notes --title "${TAG}"
          gh release upload "${TAG}" dist/* --repo "${REPOSITORY}" --clobber
